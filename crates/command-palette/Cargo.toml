[package]
name = "mpt-command-palette"
description = "Spotlight-like command palette: apps, calculator, web search, system commands and more"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mpt-command-palette"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:egui", "dep:eframe", "dep:scopeguard"]

[dependencies]
mpt-common = { path = "../common" }
mpt-app-launcher = { path = "../app-launcher" }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
egui = { workspace = true, optional = true }
eframe = { workspace = true, optional = true }
scopeguard = { version = "1", optional = true }
