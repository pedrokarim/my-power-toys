[package]
name = "mpt-workspaces"
description = "Save and restore desktop app layouts with one click"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mpt-workspaces"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:egui", "dep:eframe", "dep:scopeguard", "dep:image", "dep:resvg", "dep:dirs", "mpt-common/gui"]

[dependencies]
mpt-common = { path = "../common" }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
x11rb = { version = "0.13", features = ["allow-unsafe-code"] }
chrono = { version = "0.4", features = ["serde"] }
egui = { workspace = true, optional = true }
eframe = { workspace = true, optional = true }
scopeguard = { version = "1", optional = true }
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
resvg = { version = "0.44", default-features = false, optional = true }
dirs = { workspace = true, optional = true }
