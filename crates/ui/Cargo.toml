[package]
name = "mpt-ui"
description = "Settings UI for MyPowerToys (iced)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mpt-settings"
path = "src/main.rs"

[dependencies]
mpt-common = { path = "../common" }
mpt-awake = { path = "../awake" }
mpt-always-on-top = { path = "../always-on-top" }
mpt-key-manager = { path = "../key-manager" }
mpt-workspaces = { path = "../workspaces", default-features = false }
mpt-hosts-editor = { path = "../hosts-editor", default-features = false }
mpt-bulk-rename = { path = "../bulk-rename" }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
iced = { workspace = true }
iced_fonts = { version = "0.1", features = ["bootstrap"] }
zbus = { workspace = true }
tokio = { workspace = true }
rfd = { workspace = true }
rdev = "0.5"
