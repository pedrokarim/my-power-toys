[package]
name = "mpt-mouse-utils"
description = "Mouse utilities: find my mouse, click highlighter, crosshairs, mouse jump, cursor wrap, gliding cursor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
mpt-common = { path = "../common" }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
x11rb = { version = "0.13", features = ["allow-unsafe-code", "xinput", "shape"] }
xkeysym = "0.2"
