name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config libwayland-dev libx11-dev libxext-dev libxtst-dev libxkbcommon-dev libgl-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Update version in Cargo.toml
        run: sed -i 's/^version = ".*"/version = "${{ steps.version.outputs.VERSION }}"/' Cargo.toml

      - name: Build release binaries
        run: cargo build --release

      - name: Package release archive
        run: |
          mkdir -p dist
          cp target/release/mpt-daemon dist/
          cp target/release/mpt-ctl dist/
          cp target/release/mpt-settings dist/
          cp target/release/mpt-color-picker dist/
          cp target/release/mpt-command-palette dist/
          cp target/release/mpt-peek dist/
          cp target/release/mpt-image-resizer dist/
          cp target/release/mpt-bulk-rename dist/
          cp target/release/mpt-hosts-editor dist/
          cp target/release/mpt-fancy-zones dist/
          cp target/release/mpt-quick-accent dist/
          cp target/release/mpt-workspaces dist/
          cp -r assets dist/assets
          rm -f dist/assets/*.desktop dist/assets/*.service dist/assets/main-screen-app.png
          tar czf "my-power-toys-${{ steps.version.outputs.VERSION }}-x86_64-unknown-linux-gnu.tar.gz" -C dist mpt-daemon mpt-ctl mpt-settings mpt-color-picker mpt-command-palette mpt-peek mpt-image-resizer mpt-bulk-rename mpt-hosts-editor mpt-fancy-zones mpt-quick-accent mpt-workspaces assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: my-power-toys-*.tar.gz
