[package]
name = "mpt-image-resizer"
description = "Batch resize images with presets and custom dimensions"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "mpt-image-resizer"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:egui", "dep:eframe", "dep:scopeguard", "dep:rfd", "mpt-common/gui"]

[dependencies]
mpt-common = { path = "../common" }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
image = "0.25"
egui = { workspace = true, optional = true }
eframe = { workspace = true, optional = true }
scopeguard = { version = "1", optional = true }
rfd = { version = "0.15", optional = true }
